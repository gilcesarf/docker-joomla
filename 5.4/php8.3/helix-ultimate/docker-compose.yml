# Red y servicios Joomla (Helix Quickstart) + MySQL
services:
  joomla-mysql:
    image: mysql:8.4.8
    container_name: joomla-mysql
    command:
      - --character-set-server=utf8
      - --collation-server=utf8_general_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-MySecretPassword123}
      MYSQL_DATABASE: ${JOOMLA_DB_NAME:-bitnami_joomla}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ${MYSQL_HOST_DATA_DIR:-./database}:/var/lib/mysql
    networks:
      - joomla-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  joomla-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HELIX_QUICKSTART_URL: ${HELIX_QUICKSTART_URL:?}
        HELIX_QUICKSTART_SHA512: ${HELIX_QUICKSTART_SHA512:-}
    image: ${JOOMLA_HELIX_IMAGE:-joomla-helix-ultimate:5.4-php8.3}
    container_name: joomla-app
    depends_on:
      joomla-mysql:
        condition: service_healthy
    environment:
      JOOMLA_DB_HOST: joomla-mysql:3306
      JOOMLA_DB_USER: ${JOOMLA_DB_USER:-root}
      JOOMLA_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-MySecretPassword123}
      JOOMLA_DB_NAME: ${JOOMLA_DB_NAME:-bitnami_joomla}
    ports:
      - "${JOOMLA_HTTP_PORT:-8080}:80"
    volumes:
      - ${JOOMLA_HOST_APP_DIR:-./app}:/var/www/html
    networks:
      - joomla-network

networks:
  joomla-network:
    name: joomla-network
